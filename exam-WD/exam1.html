<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title></title>
	<style type="text/css">
		*{
			box-sizing: border-box;
			margin: 0;
		}
		.header{
				height:10vh;
				width: 100%;
				border:5px solid red;
		}

		.logo{
				height:100%;
				width:30%;
				border-right:5px solid red;
				text-align: center;
				font-size:50px;
				float:left;
		}

		.nav{
				float:left;
				padding:10px;
				font-size:30px;

		}

		.main{
				height:80vh;
				width: 100%;
				border: 5px solid orange;
		}

		.left{
				height:100%;
				width:20%;
				float:left;
				border-right: 5px solid orange;
		}

		.right{
				height:100%;
				width:80%;
				float:left;
		}

		.nameber h3{
					
				border:5px solid green;
				padding:20px;
				margin:30px;
				text-align:center;
				
		}

		.top{
				height:45%;
				margin:20px;
				padding:20px;
				border: 5px solid brown;
				
		}

		.box1{
				height:90%;
				width:47%;
				border: 5px dotted red;
				margin:15px;
				float:left;
		}

		.box2{
				height:90%;
				width:47%;
				border: 5px dotted red;
				margin:15px;
				float:left;
		}

		.bottom{
				height:45%;
				margin:20px;
				border: 5px solid brown;
				
		}
		.box3{
				height:90%;
				width:30%;
				border: 5px dotted red;
				margin:15px;
				float:left;
		}

		.box4{
				height:90%;
				width:30%;
				border: 5px dotted red;
				margin:15px;
				float:left;
		}

		.box5{
				height:90%;
				width:30%;
				border: 5px dotted red;
				margin:15px;
				float:left;
		}



		.footer{
				height:10vh;
				width: 100%;
				border:5px solid blue;
				text-align: center;
				font-size: 50px;
		}



	</style>
</head>
<body>
	<div class="header">
		<div class="logo">logo</div>
			<div class="nav">
				<a href="">home</a>
				<a href="">about</a>
				<a href="">contacts</a>
			</div>
	</div>

	<div class="main">
		<div class="left ">
		<div class="nameber">
			<h3>RESULT</h3>
			<h3>APPLY</h3>
			<h3>PLACEMENT</h3>
			<h3>RECRUTMENT</h3>
			<h3>NEWS</h3>
		</div>
		</div>

		<div class="right ">
			<div class="top">
				<div class="box1"></div>
				<div class="box2"></div>
			</div>

			<div class="bottom">
				<div class="box3"></div>
				<div class="box4"></div>
				<div class="box5"></div>
			</div>
		</div>
	</div>

	<div class="footer">footer</div>

</body>
</html>
